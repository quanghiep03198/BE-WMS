$kind: http-request
description: |-
  ### Description

  Get list of all packing weight or get specific packing weight by `scan_id`

  ### Response body schema

  | Property | Type | Description |
  | --- | --- | --- |
  | statusCode | `number` | HTTP Response status code |
  | message | `string` | Message to describe status of the request or occured error |
  | metadata | `array or null` | Packing weight list data |
  | metadata\[\].scan_id | `string` | The unique identifier for the packing weight |
  | metadata\[\].weight | `string` | The weight associated with the packing |

  ### Sample data

  ``` json
  {
      "statusCode": 200,
      "message": "Successfully",
      "metadata": [
          {
              "scan_id": "",
              "weight": ""
          }
      ]
  }

   ```

  > Get list of all packing weight or get specific packing weight by `scan_id` 
    

  #### **Response body schema**

  | Property | Type | Description |
  | --- | --- | --- |
  | statusCode | `number` | HTTP Response status code |
  | message | `string` | Message to describe status of the request or occured error |
  | metadata | `array or null` | Packing weight list data |

  #### Sample data

  ``` json
  {
      "statusCode": 200,
      "message": "Successfully",
      "metadata": [
          {
              "scan_id": "351702434437",
              "weight": "54"
          },
          {
              "scan_id": "351702434438",
              "weight": "40"
          },
          {
              "scan_id": "351702434439",
              "weight": "60"
          }
      ]
  }

   ```
