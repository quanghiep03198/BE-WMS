scripts:
  - type: afterResponse
    code: "pm.test(\"Response status code is 200\", function () {\r

      \    pm.expect(pm.response.code).to.equal(200);\r

      });\r

      \r

      \r

      pm.test(\"Response has the required fields\", function () {\r

      \    const responseData = pm.response.json();\r

      \    \r

      \    pm.expect(responseData).to.be.an('object');\r

      \    pm.expect(responseData).to.have.property('statusCode');\r

      \    pm.expect(responseData).to.have.property('message');\r

      \    pm.expect(responseData).to.have.property('metadata');\r

      });\r

      \r

      \r

      pm.test(\"Metadata is an array with at least one element\", function () {\r

      \    const responseData = pm.response.json();\r

      \  \r

      \    pm.expect(responseData.metadata).to.be.an('array').that.is.not.empty;\r

      });\r

      \r

      \r

      pm.test(\"Scan_id and weight are present in each element of metadata\", function () {\r

      \    const responseData = pm.response.json();\r

      \    \r

      \    pm.expect(responseData.metadata).to.be.an('array');\r

      \    responseData.metadata.forEach(function (item) {\r

      \        pm.expect(item.scan_id).to.exist;\r

      \        pm.expect(item.weight).to.exist;\r

      \    });\r

      });\r

      \r

      \r

      pm.test(\"Response time is less than 500ms\", function () {\r

      \  pm.expect(pm.response.responseTime).to.be.below(500);\r

      });\r\n"
    language: text/javascript
