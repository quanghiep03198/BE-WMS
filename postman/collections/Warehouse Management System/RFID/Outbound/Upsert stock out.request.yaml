$kind: http-request
description: |-
  Ships eligible EPCs for the specified MO and PO, subject to MO and PO size limits.
  Adjust sizes and quantities to match your test fixture. A 201 response means
  MongoDB committed; use Current stock transactions to check Redis-backed history.
url: "{{base_url}}/finished-goods/stock-out"
method: PUT
headers:
  X-Tenant-Id: "{{stock_tenant_id}}"
body:
  type: json
  content: |-
    {
      "mo_no": "{{stock_mo_no}}",
      "po": "{{stock_po}}",
      "sizes": [
        { "size_numcode": "05", "qty": 1 }
      ]
    }
settings: {}
order: 7000
