$kind: http-request
description: |
  
  This endpoint retrieves the profile information for the authenticated user.

  The response of this request can be documented as a JSON schema to describe the structure of the profile data.
url: "{{base_url}}/user/profile"
method: GET
headers:
  Authorization: Bearer {{auth_token}}
  Cache-Control: no-cache
  Postman-Token: <calculated when request is sent>
  Host: <calculated when request is sent>
  User-Agent: PostmanRuntime/7.39.1
  Accept: "*/*"
  Accept-Encoding: gzip, deflate, br
  Connection: keep-alive
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Get profile - Status code is 200', function () {
          pm.response.to.have.status(200);
      })

      pm.test('Response time is less than 2000ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      })

      pm.test('Response has valid structure', function () {
          const jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property('statusCode');
      })

      pm.test('Content-Type header is application/json', function () {
          pm.response.to.have.header('Content-Type');
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      })
    language: text/javascript
settings: {}
order: 2000
