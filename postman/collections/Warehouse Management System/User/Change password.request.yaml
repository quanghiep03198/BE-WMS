$kind: http-request
description: |
  
  ### Change Password

  This endpoint is used to update the user's password.

  #### Request

  - Method: `PATCH`
  - URL: `{{base_url}}/change-password`
  - Body:
    - `password` (string, required): The new password for the user.

  #### Response

  The response for this request is a JSON schema. The specific structure of the response will depend on the server's implementation and the success or failure of the password change operation.
url: "{{base_url}}/change-password"
method: PATCH
body:
  type: json
  content: "{ \r

    \    \"password\": \"123123\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
settings: {}
order: 5000
