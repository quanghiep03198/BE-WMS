$kind: http-request
description: |-
  This endpoint sends an HTTP GET request to the specified URL to refresh a token with the ID 12183. The response of this request is documented below as a JSON schema.

  ``` json
  {
    "type": "object",
    "properties": {
      "access_token": {
        "type": "string"
      },
      "token_type": {
        "type": "string"
      },
      "expires_in": {
        "type": "integer"
      }
    }
  }

   ```
