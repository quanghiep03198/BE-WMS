name: Deploy app to Windows Server (Self-hosted)

on:
   push:
      branches:
         - develop
   pull_request:
      branches:
         - develop
   workflow_dispatch:

jobs:
   sonarcloud:
      name: SonarCloud
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v4
           with:
              fetch-depth: 0

         - name: SonarCloud Scan
           uses: SonarSource/sonarcloud-github-action@master
           env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

   deploy-server-19:
      if: ${{github.ref == 'refs/heads/develop'}}
      name: Deploy to server 0.19
      runs-on: [self-hosted, 'Server-19']
      steps:
         - uses: actions/checkout@v4
           with:
              fetch-depth: 0
              clean: false

         - name: Load environment variables
           run: |
              echo "${{ secrets.ENV_VARIABLE_SVR19 }}" > .env
         - name: Convert .env file to UTF-8
           shell: bash
           run: iconv -f utf-8 -t utf-8 -c .env -o .env

         - name: Initialize Sentry CLI
           run: |
              echo "[auth]" > .sentryclirc
              echo "token=${{ secrets.SENTRY_AUTH_TOKEN }}" >> .sentryclirc
              iconv -f utf-8 -t utf-8 -c .sentryclirc -o .sentryclirc

         - name: Install dependencies
           run: pnpm install --fix-lockfile

         - name: Build Nest application
           run: pnpm build

         - name: Restart and save PM2 process
           run: |
              pm2 restart ecosystem.config.js --update-env
              pm2 save

   deploy-server-201:
      if: ${{github.ref == 'refs/heads/develop'}}
      name: Deploy to server 201.201
      runs-on: [self-hosted, 'Server-201201']
      steps:
         - uses: actions/checkout@v4
           with:
              fetch-depth: 0
              clean: false

         - name: Load environment variables
           run: |
              echo "${{ secrets.ENV_VARIABLE_SVR19 }}" > .env
              iconv -f utf-8 -t utf-8 -c .env -o .env

         - name: Initialize Sentry CLI
           run: |
              echo "[auth]" > .sentryclirc
              echo "token=${{ secrets.SENTRY_AUTH_TOKEN }}" >> .sentryclirc
              iconv -f utf-8 -t utf-8 -c .sentryclirc -o .sentryclirc

         - name: Install dependencies
           run: pnpm install --fix-lockfile

         - name: Build Nest application
           run: pnpm build

         - name: Restart and save PM2 process
           run: |
              pm2 restart ecosystem.config.js --update-env
              pm2 save

   deploy-server-5251:
      if: ${{github.ref == 'refs/heads/develop'}}
      name: Deploy to server 5.251
      runs-on: [self-hosted, 'Server-5251']
      steps:
         - uses: actions/checkout@v4
           with:
              fetch-depth: 0
